name: Update Calendar Events

# Коли запускати цей workflow
on:
  schedule:
    # 1 липня о 06:00 (UTC)
    - cron: "0 6 1 7 *"
    # 1 грудня о 06:00 (UTC) — разом із церковними святами
    - cron: "0 6 1 12 *"
    # 1 січня о 06:00 (UTC) — контрольне оновлення церковних свят
    - cron: "0 6 1 1 *"
  # Дозволяє запустити вручну кнопкою на GitHub (для перевірки)
  workflow_dispatch:

# Дозвіл для скрипта записувати зміни назад у репозиторій
permissions:
  contents: write

jobs:
  update-holidays:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити код репозиторію
        uses: actions/checkout@v5

      - name: Встановити Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Запустити скрипт оновлення державних свят
        working-directory: schoolos-calendar
        run: python scripts/fetch_holidays.py

      - name: Оновити дні ООН
        working-directory: schoolos-calendar
        run: python scripts/fetch_un_days.py

      - name: Оновити свята та події daytoday.ua
        working-directory: schoolos-calendar
        run: python -u scripts/fetch_daytoday.py

      - name: Оновити офіційні свята Верховної Ради
        working-directory: schoolos-calendar
        run: python -u scripts/fetch_rada.py

      - name: Оновити пам'ятні літературні дати (НБУ для дітей)
        working-directory: schoolos-calendar
        run: python -u scripts/fetch_chl.py

      - name: Визначити поточний місяць (для церковних оновлень)
        id: month
        run: echo "month=$(date -u +%m)" >> "$GITHUB_OUTPUT"

      # Церковні календарі (УГКЦ/ПЦУ) оновлюємо двічі на рік:
      # 1 грудня (новий рік уже опублікований) і 1 січня (контрольне).
      - name: Оновити релігійні свята (УГКЦ / ПЦУ)
        if: ${{ steps.month.outputs.month == '01' || steps.month.outputs.month == '12' }}
        working-directory: schoolos-calendar
        run: |
          pip install pypdf
          python -u scripts/fetch_church.py

      - name: Записати дату оновлення
        working-directory: schoolos-calendar
        run: python scripts/write_meta.py

      - name: Зберегти зміни в репозиторій (commit + push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schoolos-calendar/data/
          git diff --staged --quiet && echo "Змін немає" || git commit -m "Автооновлення календаря свят"
          git push
