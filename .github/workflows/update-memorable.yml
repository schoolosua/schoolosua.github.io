name: Update Memorable Dates

# Пам'ятні дати (УІНП, ~380 запитів, кілька десятків хвилин)
# — достатньо оновлювати раз на рік: середина липня
on:
  schedule:
    # 15 липня о 06:00 (UTC)
    - cron: "0 6 15 7 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-memorable:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити код репозиторію
        uses: actions/checkout@v5

      - name: Встановити Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Запустити скрипт пам'ятних дат (УІНП)
        working-directory: schoolos-calendar
        run: python -u scripts/fetch_memorable.py

      - name: Зберегти зміни в репозиторій (commit + push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schoolos-calendar/data/
          git diff --staged --quiet && echo "Змін немає" || git commit -m "Автооновлення пам'ятних дат (УІНП)"
          git push